app = 'jarvis-bridge'
primary_region = 'dfw'

[build]
  dockerfile = 'Dockerfile'

[env]
  BRIDGE_PORT = '8080'
  BRIDGE_WEBSOCKET_URL = 'wss://jarvis-bridge.fly.dev/ws'
  BRIDGE_WEBSOCKET_TOKEN = 'local-dev-token'
  BRIDGE_WEBSOCKET_VERSION = '1'
  LLM_PROVIDER = 'anthropic'
  LLM_ENABLE_FALLBACK = 'false'
  ANTHROPIC_MODEL = 'claude-haiku-4-5-20251001'
  ANTHROPIC_MAX_TOKENS = '512'
  STT_PROVIDER = 'openai'
  TTS_PROVIDER = 'openai'
  OPENAI_TTS_VOICE = 'fable'
  BRIDGE_REALTIME_SILENCE_MS = '1000'
  BRIDGE_ADDRESS_FILTER = 'jarvis'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
